<!-- Tablero NOVA en vivo (Vercel) — pegar en un widget «HTML» de Elementor o en un bloque «HTML personalizado» -->
<div class="nova-tablero-embed">
  <iframe
    src="https://nova-tablero.vercel.app"
    title="NOVA · Avance en tiempo real de la encuesta a empresas"
    loading="lazy"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <a class="nova-tablero-abrir" href="https://nova-tablero.vercel.app" target="_blank" rel="noopener">
    Abrir el tablero en pantalla completa ↗
  </a>
</div>

<style>
  /* Ocupa el 100 % del contenedor. Para borde a borde: en Elementor, sección/contenedor con
     «Ancho del contenido: Ancho completo» y relleno 0 (o plantilla de página «Elementor Ancho completo»). */
  .nova-tablero-embed {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 0;
    background: #070332; /* azul NOVA: evita el destello blanco mientras carga */
  }
  .nova-tablero-embed iframe {
    display: block;
    width: 100%;
    height: 100vh;      /* una pantalla completa: el tablero se recorre con scroll dentro */
    height: 100svh;     /* en celulares descuenta la barra del navegador */
    min-height: 620px;
    border: 0;
  }
  .nova-tablero-abrir {
    display: block;
    padding: 12px 16px;
    text-align: center;
    font: 600 14px/1.4 system-ui, sans-serif;
    color: #f4cc24 !important;
    background: #070332;
    text-decoration: none !important;
  }
  .nova-tablero-abrir:hover { text-decoration: underline !important; }
</style>
